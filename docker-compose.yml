version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: social_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: social_redis
    ports:
      - "6379:6379"

  backend:
    image: node:20-alpine
    working_dir: /app/backend
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/social_media
      JWT_SECRET: change_me
      CORS_ORIGIN: http://localhost:3001
    depends_on:
      - mongo
      - redis
    ports:
      - "3000:3000"

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - "3001:3001"

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mongo_data:
